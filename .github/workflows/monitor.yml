name: continuous-monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-monitor
  cancel-in-progress: true

jobs:
  public-synthetic-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL || 'https://automind-api-production.up.railway.app' }}
      FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL || 'https://automind-staging.vercel.app' }}
    steps:
      - name: Check API dependencies
        run: |
          health_json="$(curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 20 "$BACKEND_BASE_URL/health")"
          jq --exit-status \
            '.status == "ok" and .dependencies.database.status == "ok" and .dependencies.redis.status == "ok"' \
            <<<"$health_json"
      - name: Check public knowledge API
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 20 "$BACKEND_BASE_URL/api/v1/knowledge/sources" \
            | jq --exit-status 'type == "array" and length >= 1'
      - name: Check frontend
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 5 --retry-all-errors \
            --max-time 20 --output /dev/null "$FRONTEND_BASE_URL/"
