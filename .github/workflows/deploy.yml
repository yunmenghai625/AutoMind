name: deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: automind_test
          POSTGRES_USER: automind
          POSTGRES_PASSWORD: automind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automind -d automind_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://automind:automind@localhost:5432/automind_test
      TEST_DATABASE_URL: postgresql+asyncpg://automind:automind@localhost:5432/automind_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: phase7-ci-jwt-secret-at-least-32-characters
      VIN_HASH_SECRET: phase7-ci-vin-secret-at-least-32-characters
      NEXT_PUBLIC_API_MODE: live
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install backend dependencies
        run: pip install -e ".[dev]"
      - name: Verify backend
        run: |
          ruff format --check apps tests migrations
          ruff check apps tests migrations
          alembic upgrade head
          alembic check
          pytest
          python -m apps.api.rag.evaluate
      - name: Verify frontend
        working-directory: apps/web
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Verify production container
        run: docker build --tag automind-api:deploy-gate .

  backend:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    container: ghcr.io/railwayapp/cli:latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy API to Railway
        run: |
          if [ -n "${RAILWAY_TOKEN:-}" ]; then
            unset RAILWAY_API_TOKEN
            railway up --ci --service "$RAILWAY_SERVICE"
          else
            unset RAILWAY_TOKEN
            railway up --ci \
              --project "$RAILWAY_PROJECT_ID" \
              --environment "$RAILWAY_ENVIRONMENT" \
              --service "$RAILWAY_SERVICE"
          fi
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
          RAILWAY_ENVIRONMENT: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}

  frontend:
    needs: gate
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm install --global vercel@latest
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build and deploy frontend
        run: |
          vercel build --prod --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"

  smoke:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    steps:
      - name: Verify deployed API and frontend
        run: |
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors "$BACKEND_BASE_URL/health" \
            | jq --exit-status '.status == "ok"'
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors "$BACKEND_BASE_URL/api/v1/knowledge/sources" \
            | jq --exit-status 'length >= 4'
          curl --fail --retry 12 --retry-delay 5 --retry-all-errors "$FRONTEND_BASE_URL/"
        env:
          BACKEND_BASE_URL: ${{ vars.BACKEND_BASE_URL }}
          FRONTEND_BASE_URL: ${{ vars.FRONTEND_BASE_URL }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
